name: Deploy to IONOS

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install rsync and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: Add server to known_hosts
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$IONOS_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_TARGET_DIR: ${{ secrets.IONOS_TARGET_DIR }}
        run: |
          sshpass -e ssh "$IONOS_USER@$IONOS_HOST" "mkdir -p '$IONOS_TARGET_DIR'"

      - name: Deploy dist
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_TARGET_DIR: ${{ secrets.IONOS_TARGET_DIR }}
        run: |
          sshpass -e rsync -az --delete \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            dist/ "$IONOS_USER@$IONOS_HOST:$IONOS_TARGET_DIR"
