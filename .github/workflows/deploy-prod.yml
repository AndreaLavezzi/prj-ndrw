name: Deploy to IONOS

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy dist via SFTP
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          IONOS_TARGET_DIR: ${{ secrets.IONOS_TARGET_DIR }}
        run: |
          lftp -u "$IONOS_USER","$IONOS_PASSWORD" "sftp://$IONOS_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          cd "$IONOS_TARGET_DIR"
          mirror -R --delete --verbose dist .
          bye
          EOF
